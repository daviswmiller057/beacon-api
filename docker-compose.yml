services:
  beacon-api:
    build: .
    container_name: beacon-api
    init: true
    restart: unless-stopped
    environment:
      BEACON_API_KEY: ${BEACON_API_KEY}
      NEXTCLOUD_CALDAV_URL: ${NEXTCLOUD_CALDAV_URL}
      NEXTCLOUD_USERNAME: ${NEXTCLOUD_USERNAME}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD}
      BEACON_TIMEZONE: ${BEACON_TIMEZONE:-America/Chicago}
      BEACON_CALENDARS: ${BEACON_CALENDARS:-theater,school,personal}
      VIKUNJA_API_URL: ${VIKUNJA_API_URL}
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN}
      VIKUNJA_DEFAULT_PROJECT_ID: ${VIKUNJA_DEFAULT_PROJECT_ID:-}
      BEACON_SCHEDULE_CALENDAR: ${BEACON_SCHEDULE_CALENDAR:-personal}
      BEACON_INTERACTION_DEFAULT_DURATION_MINUTES: ${BEACON_INTERACTION_DEFAULT_DURATION_MINUTES:-60}
      BEACON_MAX_DAILY_RANGE_OCCURRENCES: ${BEACON_MAX_DAILY_RANGE_OCCURRENCES:-31}
      DAILY_BRIEF_TRAVEL_ENABLED: ${DAILY_BRIEF_TRAVEL_ENABLED:-false}
      DAILY_BRIEF_WEATHER_ENABLED: ${DAILY_BRIEF_WEATHER_ENABLED:-false}
      DAILY_BRIEF_TRAVEL_BUFFER_MINUTES: ${DAILY_BRIEF_TRAVEL_BUFFER_MINUTES:-15}
      BEACON_HOME_LOCATION: ${BEACON_HOME_LOCATION:-}
      WAZE_REGION: ${WAZE_REGION:-US}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      HOME_ASSISTANT_WEATHER_ENTITY: ${HOME_ASSISTANT_WEATHER_ENTITY:-weather.home}
      BEACON_INTERPRETER: ${BEACON_INTERPRETER:-rules}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      CONTEXT_DATABASE_PATH: /data/beacon.db
    volumes:
      - beacon_data:/data
    ports:
      - "8000:8000"
    stop_grace_period: 20s

volumes:
  beacon_data:
    name: beacon_data
